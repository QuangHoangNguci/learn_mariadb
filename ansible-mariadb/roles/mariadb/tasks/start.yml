---
# Khởi động service (script gốc để người dùng làm tay sau bước 05).
#   - Không Galera: enable + start.
#   - Galera bootstrap: tạo cluster mới cho từng instance.
#   - Galera joiner: start, data tự sync (SST) từ bootstrap.

# inst là host fact, giữ nguyên giữa các play; chỉ tính lại khi chưa có
- name: Tính thông số instance (bỏ qua nếu play trước đã tính)
  ansible.builtin.include_tasks: common.yml
  when: inst is not defined

# Chọn file theo standalone/bootstrap/joiner
- name: Chọn cách khởi động
  ansible.builtin.set_fact:
    _start_file: >-
      {% if not mariadb_galera_enabled %}start_standalone.yml{% elif mariadb_node_role == 'bootstrap' %}start_galera_bootstrap.yml{% else %}start_galera_joiner.yml{% endif %}

# Khởi động instance
- name: Khởi động instance
  ansible.builtin.include_tasks: "{{ _start_file | trim }}"
