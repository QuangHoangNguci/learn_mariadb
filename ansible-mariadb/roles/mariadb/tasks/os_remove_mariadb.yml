---
# Giải phóng port 3306
- name: Dừng và vô hiệu hóa service MariaDB/MySQL của OS
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [mariadb, mysql, mysqld]
  failed_when: false

# Tránh my.cnf của OS ảnh hưởng instance
- name: Xóa /etc/mysql
  ansible.builtin.file:
    path: /etc/mysql
    state: absent

# Dùng apt (không --force-all) để apt tự xử lý phụ thuộc, gói chưa cài thì bỏ qua
- name: Gỡ gói client MariaDB của OS
  ansible.builtin.apt:
    name: [mariadb-client, mariadb-client-core, mariadb-common]
    state: absent
    purge: true
  when: ansible_os_family == 'Debian'
