---
# Joiner chỉ start khi đã thấy node trong cluster (bootstrap, hoặc node khác khi thêm node bằng --limit)
- name: Chờ node cluster sẵn sàng nhận kết nối Galera
  vars:
    _boots: "{{ groups['mariadb_bootstrap'] | default([]) }}"
    # Node bootstrap (IP từ ansible_host hoặc facts); chưa có bootstrap thì dùng node khác trong cluster
    _peer: >-
      {{ (hostvars[_boots[0]].ansible_host | default((hostvars[_boots[0]].ansible_facts | default({})).get('default_ipv4', {}).get('address', _boots[0])))
         if _boots | length > 0 else (mariadb_cluster_nodes | difference([mariadb_node_ip]) | first) }}
  ansible.builtin.wait_for:
    host: "{{ _peer }}"
    port: "{{ inst.wsrep_listen }}"
    timeout: 120

# SST có thể rất lâu với dữ liệu lớn nên chạy async (khớp TimeoutStartSec=9000 trong unit)
- name: Start joiner (sync từ bootstrap qua SST)
  ansible.builtin.systemd:
    name: "{{ inst.service }}"
    state: started
    enabled: true
    daemon_reload: true
  async: 9100
  poll: 30

# Joiner Synced và cluster đã có ít nhất 2 node (chính nó + node đã có)
- name: Chờ joiner Synced
  ansible.builtin.include_tasks: wait_synced.yml
  vars:
    _wsrep_min_size: 2
    _wsrep_retries: 60
    _wsrep_delay: 10
