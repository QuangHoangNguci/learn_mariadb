---
# Bắt đầu từ thư mục rỗng
- name: Làm sạch thư mục tạm
  ansible.builtin.file:
    path: /tmp/mariadb_install
    state: "{{ item }}"
    mode: "0755"
  loop: [absent, directory]

# Đưa binary lên node
- name: Giải nén tarball (copy từ controller)
  ansible.builtin.unarchive:
    src: "{{ _mariadb_tarball }}"
    dest: /tmp/mariadb_install

# Tên thư mục phụ thuộc phiên bản
- name: Tìm thư mục sau giải nén
  ansible.builtin.find:
    paths: /tmp/mariadb_install
    file_type: directory
    recurse: false
  register: _extracted

# Dùng lại ở bước copy binary
- name: Lưu đường dẫn nguồn binary
  ansible.builtin.set_fact:
    _mariadb_src_dir: "{{ (_extracted.files | first).path }}"
