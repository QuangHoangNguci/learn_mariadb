---
# Tương ứng scripts/03_configure_mariadb.sh (+ lib/render_mycnf.sh)

# my.cnf/unit cần jemalloc và numactl (mariadb_missing_deps do libs.yml tính)
- name: Kiểm tra jemalloc và numactl
  ansible.builtin.assert:
    that: "'jemalloc' not in mariadb_missing_deps and 'numactl' not in mariadb_missing_deps"
    fail_msg: "Thiếu gói bắt buộc: {{ mariadb_missing_deps | join(', ') }} (chạy giai đoạn os trước)"

# Group chỉ-đọc dùng chung cho Vector; MariaDB là process duy nhất ghi log
- name: Tạo group đọc log
  ansible.builtin.group:
    name: "{{ mariadb_log_group }}"
    system: true

- name: Kiểm tra binary và config hiện có
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ inst.install_dir }}"
    - "{{ inst.conf_file }}"
  register: _cfg_st

- name: Ghi nhận trạng thái file
  ansible.builtin.set_fact:
    _bin_exists: "{{ _cfg_st.results[0].stat.exists }}"
    _conf_exists: "{{ _cfg_st.results[1].stat.exists }}"

# Bảo vệ instance đang chạy khỏi bị ghi đè config
- name: Từ chối ghi đè khi đang chạy (fresh)
  ansible.builtin.fail:
    msg: "Service {{ inst.service }} đang chạy! Dừng trước khi ghi đè config: systemctl stop {{ inst.service }}"
  when: _bin_exists and mariadb_svc_running and mariadb_install_mode == 'fresh'

# expand: nếu buffer pool đổi thì ghi .new, không đụng config đang chạy
- name: Đọc config cũ (expand)
  ansible.builtin.slurp:
    src: "{{ inst.conf_file }}"
  register: _old_conf
  when: mariadb_install_mode == 'expand' and _conf_exists

- name: Xác định file đích
  vars:
    _old_bp: >-
      {{ (_old_conf.content | b64decode | regex_search('(?m)^innodb_buffer_pool_size\s*=\s*([0-9]+)', '\1') | first)
         if (_old_conf.content is defined) else '' }}
  ansible.builtin.set_fact:
    _skip_conf: "{{ mariadb_install_mode == 'expand' and _conf_exists and (_old_bp | string) == (inst.bp_mb | string) }}"
    _target_conf: "{{ inst.conf_file ~ '.new' if (mariadb_install_mode == 'expand' and _conf_exists) else inst.conf_file }}"

- name: Bỏ qua (chưa có binary hoặc config đã khớp)
  ansible.builtin.debug:
    msg: "skip"
  when: not _bin_exists or _skip_conf

- name: Ghi cấu hình
  when: _bin_exists and not _skip_conf
  block:
    # Cho phép Vector đọc log qua group chung
    - name: Thêm user vào group đọc log
      ansible.builtin.user:
        name: "{{ inst.user }}"
        groups: "{{ mariadb_log_group }}"
        append: true

    - name: Tạo thư mục data / tmp
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0750"
      loop: ["{{ inst.data_dir }}", "{{ inst.tmp_dir }}"]

    # setgid trên log dir để file mới kế thừa group đọc log
    - name: Thư mục log (setgid, group đọc log)
      ansible.builtin.file:
        path: "{{ inst.log_dir }}"
        state: directory
        owner: "{{ inst.user }}"
        group: "{{ mariadb_log_group }}"
        mode: "2750"

    - name: Tìm file log hiện có
      ansible.builtin.find:
        paths: "{{ inst.log_dir }}"
        patterns: [mariadb.error.log, mariadb.slow.log, innodb_stat.log, database_audit.log]
        recurse: false
      register: _logs

    # Log đọc được bởi group, không ghi được
    - name: Phân quyền file log cho group đọc log
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ inst.user }}"
        group: "{{ mariadb_log_group }}"
        mode: "0640"
      loop: "{{ _logs.files }}"
      loop_control:
        label: "{{ item.path }}"

    # Binlog nằm trong LOG_DIR nhưng Vector không được đọc (không recurse: binlog có thể rất lớn)
    - name: Thư mục binlog (chỉ user instance)
      ansible.builtin.file:
        path: "{{ inst.binlog_dir }}"
        state: directory
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0750"

    # Xác định libgalera enterprise hay community
    - name: Tìm thư viện Galera provider
      ansible.builtin.stat:
        path: "{{ inst.install_dir }}/lib/{{ item }}"
      loop: [libgalera_enterprise_smm.so, libgalera_smm.so]
      register: _provider
      when: mariadb_galera_enabled

    - name: Chọn Galera provider
      ansible.builtin.set_fact:
        _wsrep_provider: "{{ (_provider.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
      when: mariadb_galera_enabled

    - name: Báo lỗi nếu thiếu libgalera
      ansible.builtin.assert:
        that: _wsrep_provider | length > 0
        fail_msg: "Không thấy libgalera_*.so trong {{ inst.install_dir }}/lib"
      when: mariadb_galera_enabled

    # backup chỉ tạo khi file có sẵn và nội dung đổi (không sinh backup mỗi lần chạy)
    - name: Render my.cnf
      ansible.builtin.template:
        src: my.cnf.j2
        dest: "{{ _target_conf }}"
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0600"
        backup: "{{ _target_conf == inst.conf_file }}"

    - name: Dọn backup my.cnf cũ
      ansible.builtin.include_tasks: backup_cleanup.yml
      vars:
        _bk_dir: "{{ inst.conf_file | dirname }}"
        _bk_pattern: "{{ inst.conf_file | basename }}.*~"

    - name: Cảnh báo cần rolling restart
      ansible.builtin.debug:
        msg:
          - "buffer pool đổi -> config mới ghi vào {{ _target_conf }}"
          - "Áp dụng: mv {{ _target_conf }} {{ inst.conf_file }} && systemctl restart {{ inst.service }}"
      when: _target_conf != inst.conf_file

    # logrotate của root trùng với job rotate log riêng, xóa file legacy
    - name: Xóa logrotate legacy
      ansible.builtin.file:
        path: "/etc/logrotate.d/{{ inst.service }}"
        state: absent
