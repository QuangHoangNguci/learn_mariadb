---
# Ghi my.cnf cho 1 instance (biến vòng lặp: inst).

# Biết instance đã được cài binary chưa
- name: "kiểm tra binary"
  ansible.builtin.stat:
    path: "{{ inst.install_dir }}"
  register: _bin

# Biết đã có my.cnf chưa (phục vụ expand)
- name: "kiểm tra config hiện có"
  ansible.builtin.stat:
    path: "{{ inst.conf_file }}"
  register: _conf

# Không thao tác khi instance đang chạy
- name: "kiểm tra service đang chạy"
  ansible.builtin.command: systemctl is-active --quiet {{ inst.service }}
  register: _active
  changed_when: false
  failed_when: false

# Bảo vệ instance đang chạy khỏi bị ghi đè config
- name: "từ chối ghi đè khi đang chạy (fresh)"
  ansible.builtin.fail:
    msg: "Service {{ inst.service }} đang chạy! Dừng trước khi ghi đè config: systemctl stop {{ inst.service }}"
  when: _bin.stat.exists and _active.rc == 0 and mariadb_install_mode == 'fresh'

# Lấy buffer pool cũ để so sánh
- name: "đọc config cũ (expand)"
  ansible.builtin.slurp:
    src: "{{ inst.conf_file }}"
  register: _old_conf
  when: mariadb_install_mode == 'expand' and _conf.stat.exists

# expand: nếu buffer pool đổi thì ghi .new, không đụng config đang chạy
- name: "xác định file đích"
  vars:
    _old_bp: >-
      {{ (_old_conf.content | b64decode | regex_search('(?m)^innodb_buffer_pool_size\s*=\s*([0-9]+)', '\1') | first)
         if (_old_conf.content is defined) else '' }}
  ansible.builtin.set_fact:
    _skip_conf: "{{ mariadb_install_mode == 'expand' and _conf.stat.exists and (_old_bp | string) == (inst.bp_mb | string) }}"
    _target_conf: "{{ inst.conf_file ~ '.new' if (mariadb_install_mode == 'expand' and _conf.stat.exists) else inst.conf_file }}"

# Ghi log lý do skip
- name: "bỏ qua (chưa có binary hoặc config đã khớp)"
  ansible.builtin.debug:
    msg: "skip"
  when: not _bin.stat.exists or _skip_conf

# Chuẩn bị thư mục/quyền và render my.cnf
- name: "ghi cấu hình"
  when: _bin.stat.exists and not _skip_conf
  block:
    # Cho phép Vector đọc log qua group chung
    - name: Thêm user vào group đọc log
      ansible.builtin.user:
        name: "{{ inst.user }}"
        groups: "{{ mariadb_log_group }}"
        append: true

    # Đảm bảo thư mục tồn tại đúng chủ sở hữu
    - name: Tạo thư mục data / tmp
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0750"
      loop: ["{{ inst.data_dir }}", "{{ inst.tmp_dir }}"]

    # setgid trên log dir để file mới kế thừa group đọc log
    - name: Thư mục log (setgid, group đọc log)
      ansible.builtin.file:
        path: "{{ inst.log_dir }}"
        state: directory
        owner: "{{ inst.user }}"
        group: "{{ mariadb_log_group }}"
        mode: "2750"

    # Lấy danh sách log cần phân quyền
    - name: Tìm file log hiện có
      ansible.builtin.find:
        paths: "{{ inst.log_dir }}"
        patterns: [mariadb.error.log, mariadb.slow.log, innodb_stat.log, database_audit.log]
        recurse: false
      register: _logs

    # Log đọc được bởi group, không ghi được
    - name: Phân quyền file log cho group đọc log
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ inst.user }}"
        group: "{{ mariadb_log_group }}"
        mode: "0640"
      loop: "{{ _logs.files }}"
      loop_control:
        label: "{{ item.path }}"

    # Binlog nằm trong LOG_DIR nhưng Vector không được đọc
    - name: Thư mục binlog (chỉ user instance)
      ansible.builtin.file:
        path: "{{ inst.binlog_dir }}"
        state: directory
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0750"
        recurse: true

    # Giữ bản sao my.cnf trước khi ghi đè
    - name: Backup config cũ
      ansible.builtin.copy:
        src: "{{ inst.conf_file }}"
        dest: "{{ inst.conf_file }}.bak.{{ ansible_date_time.epoch }}"
        remote_src: true
        mode: preserve
      when: _target_conf == inst.conf_file and _conf.stat.exists

    # Xác định libgalera enterprise hay community
    - name: Tìm thư viện Galera provider
      ansible.builtin.stat:
        path: "{{ inst.install_dir }}/lib/{{ item }}"
      loop: [libgalera_enterprise_smm.so, libgalera_smm.so]
      register: _provider
      when: mariadb_galera_enabled

    # Lưu đường dẫn provider cho template
    - name: Chọn Galera provider
      ansible.builtin.set_fact:
        _wsrep_provider: "{{ (_provider.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"
      when: mariadb_galera_enabled

    # Không có provider thì Galera không chạy được
    - name: Báo lỗi nếu thiếu libgalera
      ansible.builtin.assert:
        that: _wsrep_provider | length > 0
        fail_msg: "Không thấy libgalera_*.so trong {{ inst.install_dir }}/lib"
      when: mariadb_galera_enabled

    # Sinh file cấu hình từ template
    - name: Render my.cnf
      ansible.builtin.template:
        src: my.cnf.j2
        dest: "{{ _target_conf }}"
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0600"

    # Hướng dẫn áp dụng config mới khi expand
    - name: Cảnh báo cần rolling restart
      ansible.builtin.debug:
        msg:
          - "buffer pool đổi -> config mới ghi vào {{ _target_conf }}"
          - "Áp dụng: mv {{ _target_conf }} {{ inst.conf_file }} && systemctl restart {{ inst.service }}"
      when: _target_conf != inst.conf_file

    # logrotate của root trùng với job rotate log riêng, xóa file legacy
    - name: Xóa logrotate legacy
      ansible.builtin.file:
        path: "/etc/logrotate.d/{{ inst.service }}"
        state: absent
