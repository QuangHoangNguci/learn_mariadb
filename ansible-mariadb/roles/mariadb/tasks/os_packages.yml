---
# Cài jemalloc, numactl, iptables từ gói offline.
# Chỉ copy + cài khi node còn thiếu (hoặc mariadb_os_packages_force=true).
- name: Cài gói offline khi còn thiếu
  when: mariadb_os_packages_force or (mariadb_missing_deps | difference(['libssl1.1'])) | length > 0
  block:
    # Lấy gói offline theo OS
    - name: Liệt kê gói trên controller
      vars:
        _ext: "{{ 'deb' if ansible_facts['os_family'] == 'Debian' else 'rpm' }}"
        _globs: "{{ mariadb_os_package_subdirs | map('regex_replace', '^(.*)$', mariadb_package_dir ~ '/\\1/*.' ~ _ext) | list }}"
      ansible.builtin.set_fact:
        # Bỏ gói trùng với MySQL/MariaDB sẵn có
        _os_pkg_files: "{{ query('ansible.builtin.fileglob', *_globs) | reject('search', '/(' ~ mariadb_os_package_skip_regex ~ ')') | list }}"

    - name: Tạo thư mục tạm chứa gói
      ansible.builtin.file:
        path: "{{ mariadb_os_package_stage_dir }}"
        state: directory
        mode: "0755"
      when: _os_pkg_files | length > 0

    - name: Copy gói lên node
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ mariadb_os_package_stage_dir }}/{{ item | basename }}"
        mode: "0644"
      loop: "{{ _os_pkg_files }}"
      loop_control:
        label: "{{ item | basename }}"

    # dpkg -i cả thư mục để tự giải quyết thứ tự phụ thuộc; bỏ qua gói cùng phiên bản đã cài
    - name: Cài gói .deb
      ansible.builtin.shell: dpkg -i --skip-same-version {{ mariadb_os_package_stage_dir }}/*.deb; dpkg --configure -a
      register: _dpkg
      changed_when: "'Setting up' in _dpkg.stdout"
      failed_when: false
      when: ansible_facts['os_family'] == 'Debian' and _os_pkg_files | length > 0

    - name: Cài gói .rpm
      ansible.builtin.yum:
        name: "{{ _os_pkg_files | map('basename') | map('regex_replace', '^(.*)$', mariadb_os_package_stage_dir ~ '/\\1') | list }}"
        state: present
        disable_gpg_check: true
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat' and _os_pkg_files | length > 0

    - name: Phát hiện lại phụ thuộc sau khi cài
      ansible.builtin.include_tasks: libs.yml

# libgalera_smm.so của tarball cần libssl.so.1.1, Ubuntu 22.04+ không có sẵn. Chỉ cài riêng gói libssl1.1 (trong os-jammy,
# dùng được trên 22.04 và 24.04), không cài cả thư mục để tránh hạ cấp numactl/libnuma của OS.
- name: Cài libssl1.1 cho Galera khi còn thiếu
  when: "'libssl1.1' in mariadb_missing_deps"
  block:
    - name: Tìm gói libssl1.1 trên controller
      ansible.builtin.set_fact:
        _libssl_deb: "{{ query('ansible.builtin.fileglob', mariadb_package_dir ~ '/os-jammy/libssl1.1_*.deb') | first | default('') }}"

    - name: Báo lỗi nếu thiếu file libssl1.1
      ansible.builtin.assert:
        that: _libssl_deb | length > 0
        fail_msg: "Thiếu {{ mariadb_package_dir }}/os-jammy/libssl1.1_*.deb (Galera cần libssl.so.1.1)"

    - name: Tạo thư mục tạm chứa gói
      ansible.builtin.file:
        path: "{{ mariadb_os_package_stage_dir }}"
        state: directory
        mode: "0755"

    - name: Copy libssl1.1 lên node
      ansible.builtin.copy:
        src: "{{ _libssl_deb }}"
        dest: "{{ mariadb_os_package_stage_dir }}/{{ _libssl_deb | basename }}"
        mode: "0644"

    - name: Cài libssl1.1
      ansible.builtin.command: dpkg -i --skip-same-version {{ mariadb_os_package_stage_dir }}/{{ _libssl_deb | basename }}
      changed_when: true

    - name: Phát hiện lại phụ thuộc sau khi cài libssl1.1
      ansible.builtin.include_tasks: libs.yml

# Dừng khi vẫn thiếu gói thiết yếu (dù vừa cài hay đã có sẵn)
- name: Báo lỗi nếu thiếu gói bắt buộc
  ansible.builtin.assert:
    that: mariadb_missing_deps | length == 0
    fail_msg: "Thiếu gói bắt buộc: {{ mariadb_missing_deps | join(', ') }}. Output dpkg: {{ _dpkg.stdout | default('') }}"
