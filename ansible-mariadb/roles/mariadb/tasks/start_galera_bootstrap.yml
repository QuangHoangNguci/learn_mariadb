---
# Không thao tác khi instance đang chạy
- name: "kiểm tra service đang chạy"
  ansible.builtin.command: systemctl is-active --quiet {{ inst.service }}
  register: _active
  changed_when: false
  failed_when: false

# Unit đọc EnvironmentFile này để thêm --wsrep-new-cluster (giống galera_new_cluster)
- name: "bootstrap cluster mới"
  when: _active.rc != 0
  block:
    # Unit đọc cờ này để bootstrap
    - name: Đặt cờ wsrep-new-cluster
      ansible.builtin.copy:
        dest: "/tmp/wsrep-new-cluster"
        content: "_WSREP_NEW_CLUSTER=--wsrep-new-cluster\n"
        mode: "0644"

    # Khởi tạo cluster mới
    - name: Start instance (bootstrap)
      ansible.builtin.systemd:
        name: "{{ inst.service }}"
        state: started
        enabled: true
        daemon_reload: true
  always:
    # Xóa cờ để lần restart sau không bootstrap lại cluster mới
    - name: Xóa cờ wsrep-new-cluster
      ansible.builtin.file:
        path: "/tmp/wsrep-new-cluster"
        state: absent

# Tự chạy lại sau reboot
- name: "bật service khi reboot"
  ansible.builtin.systemd:
    name: "{{ inst.service }}"
    enabled: true

# Đợi node đồng bộ xong mới sang bước sau
- name: "chờ node Synced"
  ansible.builtin.command: >-
    {{ inst.install_dir }}/bin/mariadb -u root -S {{ inst.socket }} -Nse
    "SHOW STATUS LIKE 'wsrep_local_state_comment'"
  environment:
    MYSQL_PWD: "{{ mariadb_admin_pass }}"
  register: _state
  until: "'Synced' in _state.stdout"
  retries: 30
  delay: 5
  changed_when: false
  no_log: true
