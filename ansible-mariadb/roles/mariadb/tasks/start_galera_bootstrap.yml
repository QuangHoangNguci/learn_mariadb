---
# Không thao tác khi instance đang chạy (kiểm tra trực tiếp vì trạng thái có thể đã đổi từ lúc gather)
- name: Kiểm tra service đang chạy
  ansible.builtin.command: systemctl is-active --quiet {{ inst.service }}
  register: _active
  changed_when: false
  failed_when: false

# Unit đọc EnvironmentFile này để thêm --wsrep-new-cluster (giống galera_new_cluster).
# Đặt trong run_dir (tmpfs, chỉ user instance vào được) thay vì /tmp.
- name: Bootstrap cluster mới
  when: _active.rc != 0
  block:
    - name: Tạo thư mục runtime
      ansible.builtin.file:
        path: "{{ inst.run_dir }}"
        state: directory
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0750"

    - name: Đặt cờ wsrep-new-cluster
      ansible.builtin.copy:
        dest: "{{ inst.run_dir }}/wsrep-new-cluster"
        content: "_WSREP_NEW_CLUSTER=--wsrep-new-cluster\n"
        owner: root
        group: root
        mode: "0600"

    - name: Start instance (bootstrap)
      ansible.builtin.systemd:
        name: "{{ inst.service }}"
        state: started
        enabled: true
        daemon_reload: true
  always:
    # Xóa cờ để lần restart sau không bootstrap lại cluster mới
    - name: Xóa cờ wsrep-new-cluster
      ansible.builtin.file:
        path: "{{ inst.run_dir }}/wsrep-new-cluster"
        state: absent

- name: Bật service khi reboot
  ansible.builtin.systemd:
    name: "{{ inst.service }}"
    enabled: true

- name: Chờ bootstrap Synced
  ansible.builtin.include_tasks: wait_synced.yml
  vars:
    _wsrep_min_size: 1
    _wsrep_retries: 30
    _wsrep_delay: 5
