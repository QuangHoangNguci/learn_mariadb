---
# Init datadir cho 1 instance (biến vòng lặp: inst).

# Xác định điều kiện init datadir
- name: "kiểm tra binary, config, datadir"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ inst.install_dir }}/scripts/mariadb-install-db"
    - "{{ inst.conf_file }}"
    - "{{ inst.data_dir }}/mysql"
  register: _st

# Không thao tác khi instance đang chạy
- name: "kiểm tra service đang chạy"
  ansible.builtin.command: systemctl is-active --quiet {{ inst.service }}
  register: _active
  changed_when: false
  failed_when: false

# Tránh phá datadir đang dùng
- name: "từ chối init khi service đang chạy (fresh)"
  ansible.builtin.fail:
    msg: "Service {{ inst.service }} đang chạy! Dừng trước khi init: systemctl stop {{ inst.service }}"
  when: _active.rc == 0 and mariadb_install_mode == 'fresh'

# Tạo datadir mới nếu chưa có schema mysql
- name: "init datadir"
  # Bỏ qua nếu thiếu binary/config, đang chạy (expand) hoặc đã init
  when: _st.results[0].stat.exists and _st.results[1].stat.exists and _active.rc != 0 and not _st.results[2].stat.exists
  block:
    # Phát hiện dữ liệu cũ
    - name: Liệt kê file còn sót trong datadir
      ansible.builtin.find:
        paths: "{{ inst.data_dir }}"
        file_type: any
        hidden: true
        recurse: false
      register: _leftover

    # Không xóa datadir lạ khi expand
    - name: Từ chối xóa dữ liệu bất thường (expand)
      ansible.builtin.fail:
        msg: "Datadir {{ inst.data_dir }} có {{ _leftover.matched }} file nhưng không có schema 'mysql'. Kiểm tra thủ công."
      when: _leftover.matched > 0 and mariadb_install_mode != 'fresh'

    # Dọn datadir để install-db chạy sạch
    - name: Xóa file rác trong datadir (fresh)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _leftover.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: mariadb_install_mode == 'fresh'

    # Tạo system tables
    - name: Chạy mariadb-install-db
      ansible.builtin.command: >-
        {{ inst.install_dir }}/scripts/mariadb-install-db
        --user={{ inst.user }}
        --datadir={{ inst.data_dir }}
        --basedir={{ inst.install_dir }}
        --defaults-file={{ inst.conf_file }}

    # Datadir chỉ user instance truy cập
    - name: Phân quyền datadir
      ansible.builtin.file:
        path: "{{ inst.data_dir }}"
        owner: "{{ inst.user }}"
        group: "{{ inst.user }}"
        mode: "0750"
        recurse: true
