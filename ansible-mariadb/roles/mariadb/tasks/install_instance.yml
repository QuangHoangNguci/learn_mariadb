---
# Cài 1 instance (biến vòng lặp: inst).

# Không thao tác khi instance đang chạy
- name: "kiểm tra service đang chạy"
  ansible.builtin.command: systemctl is-active --quiet {{ inst.service }}
  register: _active
  changed_when: false
  failed_when: false

# Không cài đè instance đang chạy
- name: "từ chối nếu service đang chạy"
  ansible.builtin.fail:
    msg: "Service {{ inst.service }} đang chạy! Dừng trước khi cài fresh: systemctl stop {{ inst.service }}"
  when: _active.rc == 0 and mariadb_install_mode == 'fresh'

# Giữ bản cũ để rollback
- name: "backup thư mục cài cũ"
  ansible.builtin.command: mv {{ inst.install_dir }} {{ inst.install_dir }}.bak.{{ ansible_date_time.epoch }}
  args:
    removes: "{{ inst.install_dir }}"

# Tránh xung đột port
- name: "kiểm tra port chưa bị chiếm"
  vars:
    _listening: "{{ _ss.stdout_lines[1:] | map('split') | map(attribute=3) | map('regex_replace', '^.*:', '') | list }}"
    _need: >-
      {{ [inst.port, inst.mgnt] + ([inst.wsrep_listen, inst.wsrep_sst, inst.wsrep_ist] if mariadb_galera_enabled else []) }}
  ansible.builtin.assert:
    that: (_need | map('string') | list) | intersect(_listening) | length == 0
    fail_msg: "Port {{ _need | map('string') | list | intersect(_listening) }} đã bị chiếm"

# Mỗi instance chạy bằng user riêng
- name: "tạo user hệ thống"
  ansible.builtin.user:
    name: "{{ inst.user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# Hardlink để tiết kiệm disk; fallback copy thường nếu khác thiết bị
- name: "copy binary"
  ansible.builtin.shell: cp -al {{ _mariadb_src_dir }} {{ inst.install_dir }} 2>/dev/null || cp -a {{ _mariadb_src_dir }} {{ inst.install_dir }}
  args:
    creates: "{{ inst.install_dir }}/bin"

# Chuẩn bị nơi lưu dữ liệu và log
- name: "tạo thư mục data/tmp/log/binlog"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ inst.user }}"
    group: "{{ inst.user }}"
    mode: "0750"
  loop:
    - "{{ inst.data_dir }}"
    - "{{ inst.tmp_dir }}"
    - "{{ inst.log_dir }}"
    - "{{ inst.binlog_dir }}"

# Thư mục cha (vd /u01/data_<ID>) phải truy cập được để user instance vào thư mục con
- name: "mở quyền traverse thư mục cha"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: o+x
  loop: "{{ [inst.data_dir, inst.tmp_dir, inst.log_dir, inst.binlog_dir] | map('dirname') | unique | reject('equalto', '/') | list }}"

# User instance sở hữu binary
- name: "chown thư mục cài"
  ansible.builtin.file:
    path: "{{ inst.install_dir }}"
    owner: "{{ inst.user }}"
    group: "{{ inst.user }}"
    recurse: true

# Chỉ vá policy nếu có file này
- name: "kiểm tra file enterprise.cnf"
  ansible.builtin.stat:
    path: "{{ inst.install_dir }}/etc/mariadb-enterprise.cnf"
  register: _ent

# Hạ password policy mặc định (nếu có enterprise.cnf)
- name: "vá password policy"
  when: _ent.stat.exists
  block:
    # Tránh trùng key khi thêm lại
    - name: Xóa cấu hình simple_password_check cũ
      ansible.builtin.lineinfile:
        path: "{{ inst.install_dir }}/etc/mariadb-enterprise.cnf"
        regexp: simple_password_check
        state: absent

    # Nới lỏng policy mật khẩu mặc định
    - name: Thêm password policy
      ansible.builtin.blockinfile:
        path: "{{ inst.install_dir }}/etc/mariadb-enterprise.cnf"
        marker: "# ===== {mark} AUTO PASSWORD POLICY ====="
        block: |
          simple_password_check_digits=0
          simple_password_check_letters_same_case=0
          simple_password_check_minimal_length=6
          simple_password_check_other_characters=0

# Phát hiện thiếu thư viện/sai kiến trúc ngay
- name: "kiểm tra binary chạy được"
  ansible.builtin.command: "{{ inst.install_dir }}/bin/mariadbd --version"
  changed_when: false
